[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lt-hazira-platform"
version = "0.1.0"
description = "L&T Hazira Smart Manufacturing Analytics Platform"
authors = [{ name = "Kashyap Gupta", email = "kg1033@srmist.edu.in" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 88
